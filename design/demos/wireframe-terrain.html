<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe terrain - demo</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#07070A; height:100%; overflow:hidden; }
  body{ font-family:ui-sans-serif, system-ui, sans-serif; }
  canvas{ position:fixed; inset:0; display:block; }
  .tag{
    position:fixed; top:20px; left:20px; z-index:2; display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:#9A9AA4;
  }
  .tag a{ color:#5C86FF; text-decoration:none; border-bottom:1px solid rgba(92,134,255,.4); padding-bottom:2px; }
  .tag a:hover{ color:#fff; border-color:#fff; }
  .tag b{ color:#F2F2F4; font-weight:600; }
  .hint{
    position:fixed; bottom:20px; left:20px; z-index:2; font-family:ui-monospace,monospace;
    font-size:11px; color:#61616B; max-width:340px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="tag"><a href="./index.html">&larr; All demos</a><span>/</span><b>06 Wireframe terrain</b></div>
<div class="hint">A perspective wave field connected into a mesh instead of loose dots. No cursor interaction.</div>
<canvas id="c"></canvas>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (location.search.indexOf('motion=on') !== -1) reduce = false;
  if (location.search.indexOf('motion=off') !== -1) reduce = true;

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var w, h, dpr;
  var COLS = 56, ROWS = 30;

  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function project(t){
    var pts = [];
    var horizon = h * 0.06;
    var focal = 520;
    var spreadX = w * 1.3;
    for (var r = 0; r < ROWS; r++){
      var row = [];
      var rn = r / (ROWS - 1);
      var depth = 16 + rn * 620;
      var scale = focal / (focal + depth);
      var rowY = horizon + h * 0.96 * Math.pow(rn, 0.62);
      var fade = Math.pow(1 - rn, 0.85);
      for (var c = 0; c < COLS; c++){
        var cn = c / (COLS - 1);
        var x = (cn - 0.5) * spreadX * scale + w / 2;
        var wave =
          Math.sin(cn * 5.6 + rn * 2.1 + t * 0.36) * 40 +
          Math.sin(cn * 11.4 - rn * 3.4 + t * 0.23) * 17 +
          Math.sin((cn + rn) * 3.1 + t * 0.14) * 24;
        var y = rowY + wave * scale;
        var edge = Math.min(1, (1 - Math.abs(cn - 0.5) * 1.45) * 1.6);
        var crest = (wave + 81) / 162;
        var a = fade * Math.max(0, edge) * (0.25 + 0.55 * crest);
        row.push({ x: x, y: y, a: Math.min(1, a), onscreen: x > -20 && x < w + 20 && y > -10 && y < h + 10 });
      }
      pts.push(row);
    }
    return pts;
  }

  function draw(t){
    ctx.fillStyle = '#07070A';
    ctx.fillRect(0, 0, w, h);
    var grid = project(t);
    ctx.lineWidth = 1;

    for (var r = 0; r < ROWS; r++){
      for (var c = 0; c < COLS - 1; c++){
        var a = grid[r][c], b = grid[r][c + 1];
        if (!a.onscreen && !b.onscreen) continue;
        var al = Math.min(a.a, b.a);
        if (al <= 0.02) continue;
        ctx.strokeStyle = 'rgba(27,77,255,' + al + ')';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
    for (var r2 = 0; r2 < ROWS - 1; r2++){
      for (var c2 = 0; c2 < COLS; c2++){
        var a2 = grid[r2][c2], b2 = grid[r2 + 1][c2];
        if (!a2.onscreen && !b2.onscreen) continue;
        var al2 = Math.min(a2.a, b2.a) * 0.7;
        if (al2 <= 0.02) continue;
        ctx.strokeStyle = 'rgba(92,134,255,' + al2 + ')';
        ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
      }
    }
  }

  var raf, t0 = 0;
  function frame(now){
    if (!t0) t0 = now;
    draw((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }

  size(); draw(0);
  if (!reduce){ raf = requestAnimationFrame(frame); }
  addEventListener('resize', function(){ size(); draw(0); t0 = 0; });
})();
</script>
</body>
</html>
