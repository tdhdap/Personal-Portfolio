<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowing thread - demo</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#07070A; height:100%; overflow:hidden; }
  body{ font-family:ui-sans-serif, system-ui, sans-serif; }
  canvas{ position:fixed; inset:0; display:block; }
  .tag{
    position:fixed; top:20px; left:20px; z-index:2; display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:#9A9AA4;
  }
  .tag a{ color:#5C86FF; text-decoration:none; border-bottom:1px solid rgba(92,134,255,.4); padding-bottom:2px; }
  .tag a:hover{ color:#fff; border-color:#fff; }
  .tag b{ color:#F2F2F4; font-weight:600; }
  .hint{
    position:fixed; bottom:20px; left:20px; z-index:2; font-family:ui-monospace,monospace;
    font-size:11px; color:#61616B; max-width:340px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="tag"><a href="./index.html">&larr; All demos</a><span>/</span><b>05 Flowing thread</b></div>
<div class="hint">Two ribbons trail the cursor with lag. Wanders on its own when the mouse sits still.</div>
<canvas id="c"></canvas>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (location.search.indexOf('motion=on') !== -1) reduce = false;
  if (location.search.indexOf('motion=off') !== -1) reduce = true;

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var w, h, dpr;
  var target = { x:0, y:0 };
  var lastMove = 0;

  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    target.x = w / 2; target.y = h / 2;
  }

  function makeThread(lag, width, alpha){
    return { lag: lag, width: width, alpha: alpha, head: { x: w / 2, y: h / 2 }, pts: [] };
  }
  var threads = [];

  function wanderTarget(t){
    return {
      x: w / 2 + Math.sin(t * 0.6) * w * 0.28 + Math.sin(t * 1.7) * w * 0.08,
      y: h / 2 + Math.cos(t * 0.5) * h * 0.24 + Math.cos(t * 1.3) * h * 0.09
    };
  }

  function stepThread(th, tx, ty){
    th.head.x += (tx - th.head.x) * th.lag;
    th.head.y += (ty - th.head.y) * th.lag;
    th.pts.push({ x: th.head.x, y: th.head.y });
    if (th.pts.length > 46) th.pts.shift();
  }

  function drawThread(th){
    if (th.pts.length < 2) return;
    for (var i = 1; i < th.pts.length; i++){
      var a = i / th.pts.length;
      ctx.strokeStyle = 'rgba(' + th.color + ',' + (a * th.alpha) + ')';
      ctx.lineWidth = th.width * a;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(th.pts[i - 1].x, th.pts[i - 1].y);
      ctx.lineTo(th.pts[i].x, th.pts[i].y);
      ctx.stroke();
    }
  }

  var raf, time = 0;
  function frame(){
    time += 0.012;
    var usingMouse = (performance.now() - lastMove) < 1400;
    var tx, ty;
    if (usingMouse){ tx = target.x; ty = target.y; }
    else { var wt = wanderTarget(time); tx = wt.x; ty = wt.y; }

    ctx.fillStyle = '#07070A';
    ctx.fillRect(0, 0, w, h);

    for (var i = 0; i < threads.length; i++){ stepThread(threads[i], tx, ty); drawThread(threads[i]); }
    raf = requestAnimationFrame(frame);
  }

  size();
  threads = [
    Object.assign(makeThread(0.10, 4.5, 0.7), { color: '27,77,255' }),
    Object.assign(makeThread(0.055, 2.5, 0.55), { color: '92,134,255' })
  ];
  ctx.fillStyle = '#07070A'; ctx.fillRect(0, 0, w, h);

  if (!reduce){
    raf = requestAnimationFrame(frame);
    addEventListener('mousemove', function(e){
      target.x = e.clientX; target.y = e.clientY; lastMove = performance.now();
    });
  }
  addEventListener('resize', size);
})();
</script>
</body>
</html>
