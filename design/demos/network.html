<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neural network - demo</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#07070A; height:100%; overflow:hidden; }
  body{ font-family:ui-sans-serif, system-ui, sans-serif; }
  canvas{ position:fixed; inset:0; display:block; }
  .tag{
    position:fixed; top:20px; left:20px; z-index:2; display:flex; align-items:center; gap:10px;
    font-size:12.5px; color:#9A9AA4;
  }
  .tag a{ color:#5C86FF; text-decoration:none; border-bottom:1px solid rgba(92,134,255,.4); padding-bottom:2px; }
  .tag a:hover{ color:#fff; border-color:#fff; }
  .tag b{ color:#F2F2F4; font-weight:600; }
  .hint{
    position:fixed; bottom:20px; left:20px; z-index:2; font-family:ui-monospace,monospace;
    font-size:11px; color:#61616B; max-width:340px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="tag"><a href="./index.html">&larr; All demos</a><span>/</span><b>01 Neural network</b></div>
<div class="hint">Nodes drift and link when close. Move the cursor to pull in extra connections.</div>
<canvas id="c"></canvas>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (location.search.indexOf('motion=on') !== -1) reduce = false;
  if (location.search.indexOf('motion=off') !== -1) reduce = true;

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var w, h, dpr;
  var N = 85, LINK = 150;
  var pts = [];
  var mouse = { x:-9999, y:-9999 };

  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init(){
    pts = [];
    for (var i = 0; i < N; i++){
      pts.push({
        x: Math.random() * w, y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.22, vy: (Math.random() - 0.5) * 0.22
      });
    }
  }
  function step(){
    for (var i = 0; i < pts.length; i++){
      var p = pts[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    }
  }
  function draw(){
    ctx.fillStyle = '#07070A';
    ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = 1;
    for (var i = 0; i < pts.length; i++){
      for (var j = i + 1; j < pts.length; j++){
        var a = pts[i], b = pts[j];
        var dx = a.x - b.x, dy = a.y - b.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < LINK){
          ctx.strokeStyle = 'rgba(27,77,255,' + ((1 - d / LINK) * 0.55) + ')';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      var dxm = pts[i].x - mouse.x, dym = pts[i].y - mouse.y;
      var dm = Math.sqrt(dxm * dxm + dym * dym);
      if (dm < LINK * 1.3){
        ctx.strokeStyle = 'rgba(92,134,255,' + ((1 - dm / (LINK * 1.3)) * 0.9) + ')';
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(92,134,255,0.9)';
    for (var k = 0; k < pts.length; k++){
      ctx.beginPath(); ctx.arc(pts[k].x, pts[k].y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  var raf;
  function frame(){ step(); draw(); raf = requestAnimationFrame(frame); }

  size(); init(); draw();
  if (!reduce){
    raf = requestAnimationFrame(frame);
    addEventListener('mousemove', function(e){ mouse.x = e.clientX; mouse.y = e.clientY; });
    addEventListener('mouseleave', function(){ mouse.x = -9999; mouse.y = -9999; });
  }
  addEventListener('resize', function(){ size(); init(); draw(); });
})();
</script>
</body>
</html>
